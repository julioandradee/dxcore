<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="pkhex-engine-dotnet-url" content="_framework/dotnet.js" />
    <meta name="pkhex-engine:dotnet-url" content="_framework/dotnet.js" />
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta name="description"
          content="DXCore: Editor avançado de saves de Pokémon multiplataforma que roda direto no navegador.">
    <meta name="keywords" content="DXCore, PKHeX, Pokémon, save file editor, cross-platform, Windows, Linux, MacOS, Steam Deck">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="DXCore - Editor de Saves Pokémon">
    <meta property="og:description"
          content="DXCore: Editor avançado de saves de Pokémon multiplataforma que roda direto no navegador.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="DXCore - Editor de Saves Pokémon">
    <meta name="twitter:description"
          content="DXCore: Editor avançado de saves de Pokémon multiplataforma que roda direto no navegador.">

    <title>DXCore</title>

    <base href="%BASE_URL%"/>
    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

    <!-- Restores the URL 404.html saved, before the router reads it. -->
    <script>
        (function () {
            var redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
            if (redirect && redirect != location.href) {
                history.replaceState(null, null, redirect);
            }
        })();
    </script>
</head>

<body>
    <div id="root">
        <div class="loading-text">Loading...</div>
        <h1 class="loading-text">PKHeX for Web - A Cross-Platform Pokémon Save File Editor</h1>
    </div>

    <script type="module" src="/src/index.ts"></script>
</body>

</html>
