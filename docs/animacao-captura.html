<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DXCore - Prévia da Animação de Captura (2s)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000f22;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(13, 37, 68, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.1);
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .badge-preview {
      position: absolute;
      top: -12px;
      background: #38bdf8;
      color: #000f22;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 12px;
      border-radius: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stage {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    /* Onda de choque de captura */
    .shockwave {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      opacity: 0;
      pointer-events: none;
    }
    .animating .shockwave {
      animation: shockwave 2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes shockwave {
      0%, 84% {
        opacity: 0;
        transform: scale(0.6);
      }
      86% {
        opacity: 0.9;
        transform: scale(0.85);
      }
      100% {
        opacity: 0;
        transform: scale(1.7);
      }
    }

    /* Estrelas / partículas de captura */
    .sparkles {
      position: absolute;
      top: -20px;
      left: -20px;
      right: -20px;
      bottom: -20px;
      pointer-events: none;
      opacity: 0;
    }
    .animating .sparkles {
      animation: sparklesBurst 2s ease-out forwards;
    }

    .sparkle {
      position: absolute;
      user-select: none;
    }
    .s1 { top: 8px; left: 14px; font-size: 22px; color: #facc15; }
    .s2 { top: 12px; right: 16px; font-size: 20px; color: #38bdf8; }
    .s3 { bottom: 18px; left: 10px; font-size: 18px; color: #38bdf8; }
    .s4 { bottom: 14px; right: 14px; font-size: 22px; color: #facc15; }

    @keyframes sparklesBurst {
      0%, 82% {
        opacity: 0;
        transform: scale(0.3) rotate(0deg);
      }
      86% {
        opacity: 1;
        transform: scale(1.15) rotate(25deg);
      }
      100% {
        opacity: 0.9;
        transform: scale(1) rotate(0deg);
      }
    }

    /* Pokébola */
    .pokeball {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ea3838 0%, #dc2626 48%, #1e293b 48%, #1e293b 52%, #ffffff 52%, #e2e8f0 100%);
      border: 5px solid #1e293b;
      position: relative;
      overflow: hidden;
      transform-origin: 50% 90%;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.45);
    }

    .animating .pokeball {
      animation: pokeballWobble 2s cubic-bezier(0.3, 0.1, 0.3, 1) forwards;
    }

    /* Reflexo superior da Pokébola */
    .pokeball-highlight {
      position: absolute;
      top: 8%;
      left: 14%;
      width: 42%;
      height: 25%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 80%);
      transform: rotate(-20deg);
      pointer-events: none;
    }

    /* Faixa preta divisória central */
    .pokeball-band {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 10px;
      background: #1e293b;
      transform: translateY(-50%);
    }

    /* Botão central */
    .pokeball-button-outer {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #1e293b;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .pokeball-button-inner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pokeball-led {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid #64748b;
      background-color: #cbd5e1;
    }

    .animating .pokeball-led {
      animation: ledPulse 2s ease-in-out forwards;
    }

    @keyframes pokeballWobble {
      0% {
        transform: translateY(-24px) scale(0.92);
        box-shadow: 0 20px 20px rgba(0,0,0,0.25);
      }
      10% {
        transform: translateY(0) scale(1.06, 0.9);
        box-shadow: 0 6px 10px rgba(0,0,0,0.45);
      }
      16% {
        transform: translateY(-8px) scale(0.98, 1.02);
      }
      22% {
        transform: translateY(0) scale(1);
      }
      /* 1º balanço: esquerda */
      30% {
        transform: rotate(-24deg) translateX(-7px);
      }
      40% {
        transform: rotate(0deg) translateX(0);
      }
      /* 2º balanço: direita */
      52% {
        transform: rotate(24deg) translateX(7px);
      }
      62% {
        transform: rotate(0deg) translateX(0);
      }
      /* 3º balanço: esquerda */
      72% {
        transform: rotate(-18deg) translateX(-5px);
      }
      82% {
        transform: rotate(0deg) translateX(0);
      }
      /* Clique final de captura (1.7s) */
      86% {
        transform: scale(0.95);
      }
      90% {
        transform: scale(1.05);
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 8px 16px rgba(0,0,0,0.35);
      }
    }

    @keyframes ledPulse {
      0%, 15% {
        background-color: #cbd5e1;
        box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
      }
      /* Pulsação 1 (durante o 1º balanço) */
      25%, 35% {
        background-color: #ef4444;
        box-shadow: 0 0 14px #ef4444, inset 0 0 3px #ffffff;
      }
      42%, 48% {
        background-color: #94a3b8;
        box-shadow: inset 0 0 3px rgba(0,0,0,0.2);
      }
      /* Pulsação 2 (durante o 2º balanço) */
      50%, 60% {
        background-color: #ef4444;
        box-shadow: 0 0 14px #ef4444, inset 0 0 3px #ffffff;
      }
      68%, 70% {
        background-color: #94a3b8;
        box-shadow: inset 0 0 3px rgba(0,0,0,0.2);
      }
      /* Pulsação 3 (durante o 3º balanço) */
      72%, 82% {
        background-color: #ef4444;
        box-shadow: 0 0 14px #ef4444, inset 0 0 3px #ffffff;
      }
      /* Sucesso / Trava de captura: azul ciano DXCore (#38bdf8) */
      85% {
        background-color: #38bdf8;
        box-shadow: 0 0 20px #38bdf8, 0 0 35px #38bdf8, inset 0 0 4px #ffffff;
      }
      100% {
        background-color: #38bdf8;
        box-shadow: 0 0 12px #38bdf8, inset 0 0 3px #ffffff;
      }
    }

    /* Marca DXCore abaixo */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
    }
    .animating .brand {
      animation: brandReveal 2s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
    }

    @keyframes brandReveal {
      0%, 40% {
        opacity: 0;
        transform: translateY(12px) scale(0.95);
        letter-spacing: 1px;
      }
      75% {
        opacity: 0.7;
        transform: translateY(2px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        letter-spacing: 2px;
      }
    }

    .brand-sphere {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #38bdf8;
      box-shadow: 0 0 10px #38bdf8, inset 0 0 4px #ffffff;
      border: 2px solid #ffffff;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f8fafc;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* Painel de ações */
    .controls {
      margin-top: 32px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      background: #38bdf8;
      color: #000f22;
      border: none;
      padding: 10px 22px;
      border-radius: 24px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      transition: all 0.2s ease;
    }
    button:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(1px);
    }

    .timer-info {
      margin-top: 18px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge-preview">Prévia da Animação (2s)</div>

    <div class="stage animating" id="stage">
      <div class="shockwave"></div>
      <div class="sparkles">
        <span class="sparkle s1">✨</span>
        <span class="sparkle s2">★</span>
        <span class="sparkle s3">✦</span>
        <span class="sparkle s4">✨</span>
      </div>

      <div class="pokeball">
        <div class="pokeball-highlight"></div>
        <div class="pokeball-band"></div>
        <div class="pokeball-button-outer">
          <div class="pokeball-button-inner">
            <div class="pokeball-led"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="brand">
      <span class="brand-sphere"></span>
      <span class="brand-name">DXCore</span>
    </div>

    <div class="controls">
      <button onclick="replay()">
        <span>↻</span> Repetir Animação (2s)
      </button>
    </div>

    <div class="timer-info">
      Cronologia: 0s-0.2s Queda / 0.3s-1.5s 3 Balanços com LED / 1.7s Clique & Estrelas / 2.0s Sucesso DXCore
    </div>
  </div>

  <script>
    function replay() {
      const card = document.querySelector('.card');
      const stage = document.getElementById('stage');
      const brand = document.querySelector('.brand');

      stage.classList.remove('animating');
      brand.parentElement.classList.remove('animating');

      // Forçar reflow para reiniciar CSS keyframes
      void stage.offsetWidth;

      stage.classList.add('animating');
      brand.parentElement.classList.add('animating');
    }
  </script>
</body>
</html>
